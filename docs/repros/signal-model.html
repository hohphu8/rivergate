<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>GyosJS 0.5.1 signal/model reproduction</title>
  <main g-scope="Repro">
    <h1>Signal metadata lost through a reactive scope</h1>
    <p>
      1. Type into either input. 2. Press its reset button. Compare the input
      and the signal readout.
    </p>
    <label
      >Direct signal (0.5.1 issue)<input id="direct" g-model="text"
    /></label>
    <p>Signal value: <output id="value">{text()}</output></p>
    <button @click="reset()">Reset direct signal</button>
    <hr />
    <label>Accessor workaround<input id="accessor" g-model="model" /></label>
    <p>Signal value: <output id="fixed-value">{fixed()}</output></p>
    <button @click="resetFixed()">Reset accessor</button>
  </main>
  <script type="module">
    import Gyos from "gyosjs/csp";
    Gyos.scope("Repro", () => {
      const text = Gyos.signal("initial"),
        fixed = Gyos.signal("initial");
      window.repro = { read: () => text(), readFixed: () => fixed() };
      return {
        text,
        fixed,
        get model() {
          return fixed();
        },
        set model(v) {
          fixed(v);
        },
        reset() {
          text("reset");
        },
        resetFixed() {
          fixed("reset");
        },
      };
    });
    Gyos.mountAll();
  </script>
</html>
